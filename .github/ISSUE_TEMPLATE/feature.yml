name: Feature request
description: Propose a new verification rule, maintainer workflow, or safety primitive.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Failure mode or maintainer problem
      description: Describe the concrete problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Example or evidence
      description: Link to a real failure, workflow, or reproducible example if available.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What deterministic signal or safety boundary should Verify add?
    validations:
      required: true
